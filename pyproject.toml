[project]
name = "jobfit-agent"
version = "0.1.0"
description = "Local-first JD-resume matching and interview preparation agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "sweetheartbaby"}]
keywords = ["ai-agent", "job-search", "resume", "rag", "career"]

[project.scripts]
jobfit = "src.jobfit_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
